<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You Are Cooked</title>
<style>
  :root { --bg: #0b0b10; --ink: #efeaf5; --muted: #8b86a0; --accent: #7cf2d4; color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif;
    overflow: hidden; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    text-align: center; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    transition: opacity .3s; pointer-events: none;
  }
  body.talking .hint { opacity: 0; }
  .volume {
    position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px));
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px;
    background: rgba(255,255,255,.08); color: var(--ink); cursor: default;
  }
  .volume input { width: 96px; accent-color: var(--accent); }
  .volume output { min-width: 3.2em; font-variant-numeric: tabular-nums; color: var(--muted); }
  .settings-btn {
    position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(64px + env(safe-area-inset-top, 0px));
    display: flex; align-items: center; gap: 6px; padding: 8px 14px; border: 0; border-radius: 999px;
    background: rgba(255,255,255,.08); color: var(--ink); font: inherit; cursor: pointer;
  }
  .settings-btn:hover, .settings-btn[aria-expanded="true"] { background: rgba(255,255,255,.16); }
  .settings-btn:focus-visible, .panel a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .panel {
    position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(112px + env(safe-area-inset-top, 0px));
    width: min(260px, calc(100vw - 32px)); box-sizing: border-box; padding: 16px; border-radius: 16px;
    background: rgba(22, 22, 32, .92); border: 1px solid rgba(255,255,255,.1); cursor: default;
    display: grid; gap: 10px; backdrop-filter: blur(10px);
  }
  .panel .credit { font-size: 16px; }
  .panel .credit b { font-weight: 600; }
  .panel a {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px;
    background: rgba(255,255,255,.06); color: var(--ink); text-decoration: none; word-break: break-all;
  }
  .panel a:hover { background: rgba(255,255,255,.12); }
  .yt { flex: none; width: 22px; height: 16px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<label class="volume" id="volumeBox">Volume
  <input type="range" id="volume" min="0" max="200" value="100" step="5">
  <output id="volumeOut">100%</output>
</label>
<button class="settings-btn" id="settingsBtn" aria-expanded="false" aria-controls="settingsPanel">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  Settings
</button>
<div class="panel" id="settingsPanel" hidden>
  <div class="credit">Made by <b>Vincent</b></div>
  <a href="https://www.youtube.com/@VinCentpHan-4949" target="_blank" rel="noopener">
    <svg class="yt" viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="5" fill="#ff0033"/><path d="M11 5.5v9l7.5-4.5z" fill="#fff"/></svg>
    @VinCentpHan-4949
  </a>
</div>
<div class="hint" id="hint">Tap anywhere</div>
<audio id="voice" src="clip.mp3" preload="auto"></audio>

<script>
  const canvas = document.getElementById('c');
  const g = canvas.getContext('2d');
  const audio = document.getElementById('voice');
  const volume = document.getElementById('volume');
  const volumeOut = document.getElementById('volumeOut');
  let W, H, dpr;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  // audio
  let ctx, analyser, freq, wave, gain;
  function setup() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaElementSource(audio);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.75;
    freq = new Uint8Array(analyser.frequencyBinCount);
    wave = new Uint8Array(analyser.fftSize);
    gain = ctx.createGain();
    gain.gain.value = volume.value / 100;
    src.connect(analyser); analyser.connect(gain); gain.connect(ctx.destination);
  }
  document.getElementById('volumeBox').addEventListener('click', e => e.stopPropagation());
  volume.addEventListener('input', () => {
    volumeOut.textContent = volume.value + '%';
    if (gain) gain.gain.value = volume.value / 100;
  });

  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  settingsBtn.addEventListener('click', e => {
    e.stopPropagation();
    settingsPanel.hidden = !settingsPanel.hidden;
    settingsBtn.setAttribute('aria-expanded', String(!settingsPanel.hidden));
  });
  settingsPanel.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('keydown', e => { if (e.target.closest && e.target.closest('button, a, input')) e.stopImmediatePropagation(); }, true);

  // ripples spawn on loud moments and drift outward
  const ripples = [];
  let level = 0, lastSpawn = 0, hue = 165;
  const stars = Array.from({ length: 140 }, () => ({
    x: Math.random(), y: Math.random(), s: 0.4 + Math.random() * 1.4, p: Math.random() * 6.28, v: 0.2 + Math.random() * 0.8,
  }));
  let spin = 0;
  const BARS = 96;
  const bars = new Float32Array(BARS);

  function draw(t) {
    requestAnimationFrame(draw);
    const speaking = analyser && !audio.paused;
    let loud = 0;
    if (speaking) {
      analyser.getByteFrequencyData(freq);
      analyser.getByteTimeDomainData(wave);
      let sum = 0;
      for (const v of wave) { const d = (v - 128) / 128; sum += d * d; }
      loud = Math.min(1, Math.sqrt(sum / wave.length) * 5);
    }
    level += (loud - level) * 0.25;
    hue = (hue + 0.06 + level * 0.4) % 360;   // colors drift, faster when loud

    const cx = W / 2, cy = H / 2;
    const R = Math.min(W, H) * 0.155;
    const breathe = speaking ? 0 : Math.sin(t / 900) * 0.03;
    const r = R * (1 + level * 0.18 + breathe);

    g.clearRect(0, 0, W, H);
    spin += 0.004 + level * 0.03;

    // twinkling starfield drifting upward
    for (const st of stars) {
      const y = ((st.y - t * 0.00001 * st.v) % 1 + 1) % 1;
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(t / 900 * st.v + st.p));
      g.fillStyle = `hsla(${hue + st.p * 30}, 80%, 80%, ${tw * (0.35 + level * 0.5)})`;
      g.beginPath(); g.arc(st.x * W, y * H, st.s * (1 + level), 0, Math.PI * 2); g.fill();
    }

    // dashed orbit rings, counter-rotating, with glowing dots riding them
    const orbits = [
      { rr: r * 1.95, dir: 1, dash: [3, 9], dots: 3, size: 4 },
      { rr: r * 2.45, dir: -1, dash: [14, 10], dots: 4, size: 3 },
      { rr: r * 2.75, dir: 0.6, dash: [2, 16], dots: 2, size: 5 },
    ];
    orbits.forEach((o, k) => {
      const a = spin * o.dir;
      g.save();
      g.translate(cx, cy); g.rotate(a);
      g.setLineDash(o.dash);
      g.strokeStyle = `hsla(${hue + 40 * (k + 1)}, 80%, 65%, ${0.28 + level * 0.3})`;
      g.lineWidth = 1.5;
      g.beginPath(); g.arc(0, 0, o.rr, 0, Math.PI * 2); g.stroke();
      g.setLineDash([]);
      for (let d = 0; d < o.dots; d++) {
        const da = (d / o.dots) * Math.PI * 2 + a * 1.7;
        const x = Math.cos(da) * o.rr, y = Math.sin(da) * o.rr;
        const halo = g.createRadialGradient(x, y, 0, x, y, o.size * 4);
        halo.addColorStop(0, `hsla(${hue + 80 * k}, 100%, 80%, 0.9)`);
        halo.addColorStop(1, `hsla(${hue + 80 * k}, 100%, 60%, 0)`);
        g.fillStyle = halo;
        g.beginPath(); g.arc(x, y, o.size * 4, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#fff';
        g.beginPath(); g.arc(x, y, o.size * 0.6, 0, Math.PI * 2); g.fill();
      }
      g.restore();
    });

    // spinning arc segments just outside the bars
    g.save();
    g.translate(cx, cy); g.rotate(-spin * 1.3);
    g.lineCap = 'round';
    for (let k = 0; k < 6; k++) {
      const a0 = (k / 6) * Math.PI * 2;
      g.strokeStyle = `hsla(${hue + k * 30}, 90%, 70%, ${0.5 + level * 0.4})`;
      g.lineWidth = 3;
      g.beginPath(); g.arc(0, 0, r * 1.62 + level * r * 0.25, a0, a0 + 0.45 + level * 0.3); g.stroke();
    }
    g.restore();

    // ripples
    if (speaking && level > 0.18 && t - lastSpawn > 140) { ripples.push({ born: t, a: level }); lastSpawn = t; }
    if (!speaking && t - lastSpawn > 1600) { ripples.push({ born: t, a: 0.25 }); lastSpawn = t; }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const age = (t - ripples[i].born) / 2200;
      if (age > 1) { ripples.splice(i, 1); continue; }
      g.beginPath();
      g.arc(cx, cy, r + age * Math.min(W, H) * 0.42, 0, Math.PI * 2);
      g.strokeStyle = `hsla(${hue + age * 90}, 90%, 70%, ${(1 - age) * 0.5 * ripples[i].a})`;
      g.lineWidth = 2;
      g.stroke();
    }

    // radial frequency bars around the circle
    for (let i = 0; i < BARS; i++) {
      const half = i < BARS / 2 ? i : BARS - 1 - i;          // mirror left/right
      const bin = Math.floor(2 + half * 3.2);
      const target = speaking ? Math.pow(freq[bin] / 255, 1.6) : 0.04 + 0.03 * Math.sin(t / 600 + i * 0.4);
      bars[i] += (target - bars[i]) * 0.35;
      const ang = (i / BARS) * Math.PI * 2 - Math.PI / 2;
      const len = 6 + bars[i] * R * 1.1;
      const x1 = cx + Math.cos(ang) * (r + 8), y1 = cy + Math.sin(ang) * (r + 8);
      const x2 = cx + Math.cos(ang) * (r + 8 + len), y2 = cy + Math.sin(ang) * (r + 8 + len);
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2);
      g.strokeStyle = `hsla(${hue + Math.sin(i / BARS * Math.PI * 2) * 70 + bars[i] * 60}, 90%, ${60 + bars[i] * 15}%, ${0.6 + bars[i] * 0.4})`;
      g.lineWidth = Math.max(2, (Math.PI * 2 * r) / BARS * 0.45);
      g.lineCap = 'round';
      g.stroke();
    }

    // glowing core
    const glow = g.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 1.6);
    glow.addColorStop(0, `hsla(${hue}, 90%, 65%, ${0.28 + level * 0.35})`);
    glow.addColorStop(1, `hsla(${hue + 60}, 90%, 60%, 0)`);
    g.fillStyle = glow;
    g.beginPath(); g.arc(cx, cy, r * 1.6, 0, Math.PI * 2); g.fill();

    const core = g.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.1, cx, cy, r);
    core.addColorStop(0, `hsl(${hue}, 100%, 92%)`);
    core.addColorStop(0.45, `hsl(${hue + 40}, 75%, 58%)`);
    core.addColorStop(1, `hsl(${hue + 110}, 60%, 32%)`);
    g.fillStyle = core;
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();

    // live waveform across the circle
    g.save();
    g.beginPath(); g.arc(cx, cy, r * 0.92, 0, Math.PI * 2); g.clip();
    g.beginPath();
    const span = r * 1.7;
    for (let i = 0; i <= 128; i++) {
      const x = cx - span / 2 + (i / 128) * span;
      const v = speaking ? (wave[Math.floor(i * wave.length / 129)] - 128) / 128 : Math.sin(t / 400 + i / 10) * 0.03;
      const y = cy + v * r * 1.4;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.strokeStyle = 'rgba(10, 20, 40, 0.75)';
    g.lineWidth = 3;
    g.lineJoin = 'round';
    g.stroke();
    g.restore();
  }
  requestAnimationFrame(draw);

  function talk() {
    if (!audio.paused) return;
    if (!ctx) setup();
    ctx.resume();
    audio.currentTime = 0;
    audio.play();
    document.body.classList.add('talking');
  }
  audio.addEventListener('ended', () => document.body.classList.remove('talking'));
  document.body.addEventListener('click', talk);
  document.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); talk(); } });
</script>
</body>
</html>
