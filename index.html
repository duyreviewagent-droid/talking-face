<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You Are Cooked</title>
<style>
  :root { --bg: #0b0b10; --ink: #efeaf5; --muted: #8b86a0; --accent: #7cf2d4; color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif;
    overflow: hidden; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    text-align: center; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    transition: opacity .3s; pointer-events: none;
  }
  body.talking .hint { opacity: 0; }
  .volume {
    position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px));
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px;
    background: rgba(255,255,255,.08); color: var(--ink); cursor: default;
  }
  .volume input { width: 96px; accent-color: var(--accent); }
  .volume output { min-width: 3.2em; font-variant-numeric: tabular-nums; color: var(--muted); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<label class="volume" id="volumeBox">Volume
  <input type="range" id="volume" min="0" max="200" value="100" step="5">
  <output id="volumeOut">100%</output>
</label>
<div class="hint" id="hint">Tap anywhere</div>
<audio id="voice" src="clip.mp3" preload="auto"></audio>

<script>
  const canvas = document.getElementById('c');
  const g = canvas.getContext('2d');
  const audio = document.getElementById('voice');
  const volume = document.getElementById('volume');
  const volumeOut = document.getElementById('volumeOut');
  let W, H, dpr;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  // audio
  let ctx, analyser, freq, wave, gain;
  function setup() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaElementSource(audio);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.75;
    freq = new Uint8Array(analyser.frequencyBinCount);
    wave = new Uint8Array(analyser.fftSize);
    gain = ctx.createGain();
    gain.gain.value = volume.value / 100;
    src.connect(analyser); analyser.connect(gain); gain.connect(ctx.destination);
  }
  document.getElementById('volumeBox').addEventListener('click', e => e.stopPropagation());
  volume.addEventListener('input', () => {
    volumeOut.textContent = volume.value + '%';
    if (gain) gain.gain.value = volume.value / 100;
  });

  // ripples spawn on loud moments and drift outward
  const ripples = [];
  let level = 0, lastSpawn = 0;
  const BARS = 96;
  const bars = new Float32Array(BARS);

  function draw(t) {
    requestAnimationFrame(draw);
    const speaking = analyser && !audio.paused;
    let loud = 0;
    if (speaking) {
      analyser.getByteFrequencyData(freq);
      analyser.getByteTimeDomainData(wave);
      let sum = 0;
      for (const v of wave) { const d = (v - 128) / 128; sum += d * d; }
      loud = Math.min(1, Math.sqrt(sum / wave.length) * 5);
    }
    level += (loud - level) * 0.25;

    const cx = W / 2, cy = H / 2;
    const R = Math.min(W, H) * 0.17;
    const breathe = speaking ? 0 : Math.sin(t / 900) * 0.03;
    const r = R * (1 + level * 0.18 + breathe);

    g.clearRect(0, 0, W, H);

    // ripples
    if (speaking && level > 0.18 && t - lastSpawn > 140) { ripples.push({ born: t, a: level }); lastSpawn = t; }
    if (!speaking && t - lastSpawn > 1600) { ripples.push({ born: t, a: 0.25 }); lastSpawn = t; }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const age = (t - ripples[i].born) / 2200;
      if (age > 1) { ripples.splice(i, 1); continue; }
      g.beginPath();
      g.arc(cx, cy, r + age * Math.min(W, H) * 0.42, 0, Math.PI * 2);
      g.strokeStyle = `rgba(124, 242, 212, ${(1 - age) * 0.45 * ripples[i].a})`;
      g.lineWidth = 2;
      g.stroke();
    }

    // radial frequency bars around the circle
    for (let i = 0; i < BARS; i++) {
      const half = i < BARS / 2 ? i : BARS - 1 - i;          // mirror left/right
      const bin = Math.floor(2 + half * 3.2);
      const target = speaking ? Math.pow(freq[bin] / 255, 1.6) : 0.04 + 0.03 * Math.sin(t / 600 + i * 0.4);
      bars[i] += (target - bars[i]) * 0.35;
      const ang = (i / BARS) * Math.PI * 2 - Math.PI / 2;
      const len = 6 + bars[i] * R * 1.1;
      const x1 = cx + Math.cos(ang) * (r + 8), y1 = cy + Math.sin(ang) * (r + 8);
      const x2 = cx + Math.cos(ang) * (r + 8 + len), y2 = cy + Math.sin(ang) * (r + 8 + len);
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2);
      g.strokeStyle = `hsla(${165 + bars[i] * 110}, 85%, ${60 + bars[i] * 15}%, ${0.55 + bars[i] * 0.45})`;
      g.lineWidth = Math.max(2, (Math.PI * 2 * r) / BARS * 0.45);
      g.lineCap = 'round';
      g.stroke();
    }

    // glowing core
    const glow = g.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 1.6);
    glow.addColorStop(0, `rgba(124, 242, 212, ${0.25 + level * 0.35})`);
    glow.addColorStop(1, 'rgba(124, 242, 212, 0)');
    g.fillStyle = glow;
    g.beginPath(); g.arc(cx, cy, r * 1.6, 0, Math.PI * 2); g.fill();

    const core = g.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.1, cx, cy, r);
    core.addColorStop(0, '#d9fff4');
    core.addColorStop(0.45, '#56d8c0');
    core.addColorStop(1, '#2a5f8f');
    g.fillStyle = core;
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();

    // live waveform across the circle
    g.save();
    g.beginPath(); g.arc(cx, cy, r * 0.92, 0, Math.PI * 2); g.clip();
    g.beginPath();
    const span = r * 1.7;
    for (let i = 0; i <= 128; i++) {
      const x = cx - span / 2 + (i / 128) * span;
      const v = speaking ? (wave[Math.floor(i * wave.length / 129)] - 128) / 128 : Math.sin(t / 400 + i / 10) * 0.03;
      const y = cy + v * r * 1.4;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.strokeStyle = 'rgba(10, 20, 40, 0.75)';
    g.lineWidth = 3;
    g.lineJoin = 'round';
    g.stroke();
    g.restore();
  }
  requestAnimationFrame(draw);

  function talk() {
    if (!audio.paused) return;
    if (!ctx) setup();
    ctx.resume();
    audio.currentTime = 0;
    audio.play();
    document.body.classList.add('talking');
  }
  audio.addEventListener('ended', () => document.body.classList.remove('talking'));
  document.body.addEventListener('click', talk);
  document.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); talk(); } });
</script>
</body>
</html>
